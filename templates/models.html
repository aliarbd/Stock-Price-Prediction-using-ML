<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saved Models — Stock Prediction Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/styles.css?v=4" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
  
  {% include 'nav.html' %}

  <div class="max-w-7xl mx-auto py-8 px-6">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Saved Models Registry</h1>
        <p class="text-slate-500 text-sm mt-1">Manage trained models, execute zero-retrain live predictions, and toggle auto-update schedules.</p>
      </div>
      <a href="/" class="btn btn-primary bg-indigo-600 border-indigo-600 hover:bg-indigo-700 font-medium inline-flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Train New Model
      </a>
    </div>

    <!-- Alert status banner -->
    <div id="models-status-alert" class="alert alert-info d-none mb-6" role="alert"></div>

    <!-- Models List Table / Cards -->
    <div id="models-container" class="space-y-6">
      <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 shadow-sm">
        <div class="spinner-border text-indigo-600" role="status">
          <span class="visually-hidden">Loading models...</span>
        </div>
        <p class="text-slate-500 text-sm mt-3">Fetching saved models...</p>
      </div>
    </div>
  </div>

  <script>
    async function loadModels() {
      const container = document.getElementById("models-container");
      const alertBox = document.getElementById("models-status-alert");

      try {
        const response = await fetch("/api/models");
        const models = await response.json();

        if (!models || models.length === 0) {
          container.innerHTML = `
            <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
              <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
              </div>
              <h3 class="text-lg font-bold text-slate-800">No Saved Models Found</h3>
              <p class="text-slate-500 text-sm mt-1 max-w-md mx-auto">Train your first model on the Dashboard and save it to execute instant live predictions without retraining.</p>
              <a href="/" class="btn btn-indigo mt-4 bg-indigo-600 text-white hover:bg-indigo-700 px-6 py-2 rounded-xl text-sm font-semibold">Go to Dashboard</a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${models.map(m => renderModelCard(m)).join("")}
          </div>
        `;
      } catch (err) {
        alertBox.className = "alert alert-danger mb-6";
        alertBox.textContent = "Failed to load saved models: " + err.message;
        alertBox.classList.remove("d-none");
      }
    }

    function renderModelCard(m) {
      const rmse = m.metrics?.RMSE != null ? Number(m.metrics.RMSE).toFixed(4) : "-";
      const da = m.metrics?.["Directional Accuracy (%)"] != null ? Number(m.metrics["Directional Accuracy (%)"]).toFixed(2) + "%" : "-";
      const isActive = m.is_active === 1;

      return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden flex flex-col justify-between">
          <div class="p-6">
            <div class="flex items-center justify-between mb-3">
              <span class="px-3 py-1 text-xs font-bold rounded-full ${isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600'}">
                ${m.status || (isActive ? 'Active' : 'Inactive')}
              </span>
              <span class="text-xs font-mono text-slate-400">v${m.version || 1} · ID: ${m.id.substring(0, 8)}</span>
            </div>

            <h3 class="text-xl font-bold text-slate-900 mb-1">${m.name}</h3>
            <p class="text-sm font-semibold text-indigo-600 mb-4 flex items-center gap-2">
              <span class="bg-indigo-50 px-2 py-0.5 rounded text-indigo-700">${m.symbol}</span>
              <span class="text-slate-400">·</span>
              <span class="text-slate-500 font-normal">${m.exchange}</span>
            </p>

            <div class="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl mb-4 text-xs">
              <div>
                <span class="text-slate-400 block font-medium">Model Type</span>
                <span class="font-semibold text-slate-800">${m.model_type}</span>
              </div>
              <div>
                <span class="text-slate-400 block font-medium">Timestep</span>
                <span class="font-semibold text-slate-800">${m.timestep} bars</span>
              </div>
              <div>
                <span class="text-slate-400 block font-medium">Test RMSE</span>
                <span class="font-semibold text-slate-800">${rmse}</span>
              </div>
              <div>
                <span class="text-slate-400 block font-medium">Test Dir. Acc.</span>
                <span class="font-semibold text-emerald-600">${da}</span>
              </div>
            </div>

            <div class="text-xs text-slate-500 space-y-1">
              <p><strong>Training Range:</strong> ${m.train_start || '-'} → ${m.train_end || '-'}</p>
              <p><strong>Last Prediction:</strong> ${m.latest_prediction_val ? '$' + Number(m.latest_prediction_val).toFixed(2) : 'None'}</p>
            </div>
          </div>

          <div class="border-t border-slate-100 p-4 bg-slate-50/50 flex flex-wrap items-center justify-between gap-2">
            <button onclick="predictNow('${m.id}')" class="btn btn-sm bg-indigo-600 text-white hover:bg-indigo-700 font-medium px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              Predict Now
            </button>
            <div class="flex items-center gap-1">
              <a href="/models/${m.id}" class="btn btn-sm btn-light border text-slate-700 hover:bg-slate-100 text-xs py-1.5">Details</a>
              <button onclick="deleteModel('${m.id}')" class="btn btn-sm text-pink-600 hover:bg-pink-50 p-1.5 rounded-lg" title="Delete Model">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function predictNow(modelId) {
      window.location.href = `/predict?model_id=${modelId}`;
    }

    async function deleteModel(modelId) {
      if (!confirm("Are you sure you want to delete this saved model?")) return;
      try {
        const response = await fetch(`/api/models/${modelId}`, { method: "DELETE" });
        if (response.ok) {
          loadModels();
        } else {
          alert("Failed to delete model.");
        }
      } catch (err) {
        alert("Error deleting model: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", loadModels);
  </script>
</body>
</html>
